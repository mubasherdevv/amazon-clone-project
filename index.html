    <script>
      (function() {
        try {
          var _rawFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _rawFetch;
            },
            set: function(fn) {
              _rawFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var _pFetch = proto.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() {
                  return _pFetch;
                },
                set: function(fn) {
                  _pFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {}
        }

        window.addEventListener('error', function(e) {
          if (e && e.message && e.message.indexOf('Cannot set property fetch') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
